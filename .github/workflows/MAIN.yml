name: profile

on:
  # refresh stats + snake once a day
  schedule:
    - cron: "0 0 * * *"
  # manual run from the Actions tab
  workflow_dispatch:
  # rebuild whenever the README or generator changes
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # snake eats the contribution graph, in GitHub's own light/dark palettes
      - name: generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # live stats panel, dark + light (GitHub GraphQL -> SVG, stdlib python)
      - name: generate stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_pixel.py stats dist

      # everything in dist/ is published to the `output` branch
      # served at https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

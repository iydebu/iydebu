name: pixel profile

on:
  # refresh stats + snake once a day
  schedule:
    - cron: "0 0 * * *"
  # manual run from the Actions tab
  workflow_dispatch:
  # rebuild whenever the README or generator changes
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # snake eats the contribution graph; pixel-snake.svg uses the teal palette
      - name: generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/pixel-snake.svg?color_snake=#fbbf24&color_dots=#132a2e,#0e4f4a,#0f766e,#14b8a6,#5eead4

      # live PLAYER STATS panel (GitHub GraphQL -> pixel SVG, stdlib python)
      - name: generate pixel stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_pixel.py stats dist/pixel-stats.svg

      # everything in dist/ is published to the `output` branch
      # served at https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
